[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vigil-backend"
version = "0.1.0"
description = "Vigil: a self-hostable proactive AI assistant with approval-gated sandboxed execution."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.15"
# Upper bound is load-bearing: onnxruntime 1.31.1 ships wheels for
# CPython 3.12-3.14 only and no sdist, so 3.15 breaks `uv sync --frozen`.
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.0",
    "alembic>=1.13.0",
    "httpx>=0.27.0",
    "structlog>=24.2.0",
    "cryptography>=43.0.0",
    "qrcode>=7.4.2",
    "numpy>=1.26.0",
    "onnxruntime>=1.19.0",
    "tokenizers>=0.20.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    # Provider tokenizer for context compaction. Tier 1 must count tokens with
    # the tokenizer of the configured model, never with a character estimate.
    "tiktoken>=0.7.0",
    "pypdf>=4.2.0",
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
    "python-multipart>=0.0.33",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src", ".."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
