services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: virgil-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-virgil}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-virgil}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: virgil-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-virgil}
      APP_ENV: ${APP_ENV:-development}
      # No default. A missing key fails the compose command, not the boot.
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set. Generate one with openssl rand -hex 32}
      PORT: 8000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Readiness, not liveness: a node without a database leaves the pool.
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: virgil-worker
    restart: unless-stopped
    command: ["python", "-m", "src.worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-virgil}
      APP_ENV: ${APP_ENV:-development}
      # The worker decrypts stored credentials, so it needs the same key.
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set. Generate one with openssl rand -hex 32}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
