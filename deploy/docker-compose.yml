services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: vigil-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vigil}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-vigil}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: vigil-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-vigil}
      APP_ENV: ${APP_ENV:-development}
      # No default. A missing key fails the compose command, not the boot.
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set. Generate one with openssl rand -hex 32}
      PORT: 8000
      # The api service must NOT poll the job queue: it has no Docker socket, so
      # every sandbox it tries to create fails. The worker service below polls.
      EMBED_WORKER: "false"
    volumes:
      - vigil_workspaces:/var/vigil/workspaces
      - vigil_skills:/var/vigil/skills
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Readiness, not liveness: a node without a database leaves the pool.
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # The only job poller in this deployment. Keep this service: it holds the
  # Docker socket that sandbox runs need, and the api service keeps
  # EMBED_WORKER=false so two pollers never claim the same queue.
  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: vigil-worker
    restart: unless-stopped
    command: ["python", "-m", "src.worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-vigil}
      APP_ENV: ${APP_ENV:-development}
      # The worker decrypts stored credentials, so it needs the same key.
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set. Generate one with openssl rand -hex 32}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - vigil_workspaces:/var/vigil/workspaces
      - vigil_skills:/var/vigil/skills
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  vigil_workspaces:
  vigil_skills:
